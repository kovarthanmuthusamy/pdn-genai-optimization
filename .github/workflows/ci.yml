name: CI

# Data-free checks of the current model's code (thesis_code/ + assistant_web/) on a CPU runner. The dataset,
# the trained weights and eCADSTAR are not on GitHub; the full suites run on the workstation (make test-full).
on:
  push:
    branches: [main, assistant-web]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install "ruff>=0.5"
      - name: Ruff (rules in pyproject.toml)
        run: ruff check thesis_code assistant_web tests/ci tools/mlflow_log_run.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU PyTorch + pinned runtime + dev/tracking extras)
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e ".[dev,tracking]"
      - name: Data-free test suite
        run: pytest tests/ci -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Annotate failing tests
        if: failure()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          if not os.path.exists("test-results.xml"):
              print("::error title=pytest::no test report: pytest stopped before running tests (collection or conftest error)")
              raise SystemExit(0)
          for case in ET.parse("test-results.xml").iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  msg = (bad.get("message") or bad.text or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image (CPU wheels) and run the suite inside it
        run: |
          docker build --target test --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu -t pdn-assistant:test .
          docker run --rm pdn-assistant:test
      - name: Build the serving image (CPU wheels) and check the app imports
        run: |
          docker build --target serve --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu -t pdn-assistant:serve .
          docker run --rm pdn-assistant:serve python -c "import assistant_web.server, thesis_code.s05_model.vae; print('ok')"
      - name: Validate docker-compose.yml
        run: docker compose config -q
