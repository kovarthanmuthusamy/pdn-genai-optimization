name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint with Ruff
        run: ruff check experiments/exp059_capacity_freq/codes serving/ tests/
        continue-on-error: true  # Don't block on lint warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pydantic torch numpy
      - name: Run tests
        run: pytest tests/ -v --tb=short
        timeout-minutes: 10

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t genai-pdn:ci .
        timeout-minutes: 30
      - name: Smoke test image
        run: |
          docker run --rm genai-pdn:ci python --version
