name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint with Ruff
        run: ruff check experiments/exp059_capacity_freq/codes serving/ tests/
        continue-on-error: true  # Don't block on lint warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest pydantic torch numpy scipy scikit-learn scikit-image gpytorch
      - name: Run tests
        run: pytest tests/ -v --tb=short
        timeout-minutes: 15

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (CI-optimized, CPU-only)
        run: docker build -t genai-pdn:ci -f Dockerfile.ci .
        timeout-minutes: 15
      - name: Smoke test image
        run: |
          docker run --rm genai-pdn:ci python --version
