[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-pdn"
version = "0.1.0"
description = "Generative AI surrogate + inverse-design for PCB Power Delivery Network decap placement"
authors = [{name = "Kovarthanam Muthusamy", email = "mkovarthan@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch==2.7.1",
    "numpy==2.1.2",
    "scipy>=1.15.0",
    "scikit-learn>=1.7.0",
    "scikit-image==0.25.2",
    "matplotlib>=3.10.0",
    "PyYAML>=6.0",
    # GP error surrogate (AL default)
    "gpytorch==1.15.2",
    # New tools (Tier 1 MLOps)
    "pydantic>=2.0",
    "pytest>=7.0",
    "mlflow>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # Utilities
    "tqdm>=4.60",
    "requests>=2.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
