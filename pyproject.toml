[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-pdn"
version = "1.0.0"
description = "Multi-modal VAE surrogate and design assistant for PCB power-delivery-network decap placement"
readme = "README.md"
authors = [{name = "Kovarthanam Muthusamy", email = "mkovarthan@gmail.com"}]
requires-python = ">=3.10"
# Runtime of thesis_code/ and assistant_web/. Exact versions of a tested environment: requirements.txt.
# torch is installed from the PyTorch index that matches the machine (CUDA or CPU), see the README.
dependencies = [
    "torch>=2.4,<2.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.5"]
tracking = ["mlflow>=2.10"]
# The older research code (experiments/, pipelines/, active_learning_pi/, legacy/)
legacy = ["scikit-learn>=1.3", "scikit-image>=0.22", "gpytorch>=1.11", "PyYAML>=6.0", "tqdm>=4.60", "requests>=2.28"]

[tool.setuptools.packages.find]
include = ["thesis_code*", "assistant_web*"]

[tool.setuptools.package-data]
thesis_code = ["common/inputs/*"]
assistant_web = ["examples.json", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
# A bare `pytest` runs the data-free suite (as CI does). The full suites need the trained weights and GPUs:
#   pytest tests/thesis_code tests/assistant_web
testpaths = ["tests/ci"]
pythonpath = ["."]          # the repo root, so tests/conftest.py finds repo_paths with the plain `pytest` command
python_files = "test_*.py"
python_functions = "test_*"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "experiments", "pipelines", "active_learning_pi", "scrap", "scratch", "src_vae",
                  "evaluation", "libs", "Thesis_report", "thesis_vault", "viewer", "book", "ppt", "slides"]

[tool.ruff.lint]
# Correctness (pyflakes, syntax, imports); the compact one-line statements of the thesis code are allowed.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741"]
